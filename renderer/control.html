<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ForCalls</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0f12;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 10px;
    }
    .drag-area { -webkit-app-region: drag; padding-bottom: 4px; }
    .drag-area * { -webkit-app-region: no-drag; }
    h1 { font-size: 18px; font-weight: 700; color: #fff; }
    .subtitle { font-size: 12px; color: #555; margin-top: -6px; }

    .mode-row { display: flex; gap: 8px; }
    .mode-btn {
      flex: 1; padding: 8px; border-radius: 8px;
      border: 1px solid #374151; background: #1f2937;
      color: #9ca3af; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .mode-btn.active { background: #374151; color: #fff; border-color: #6b7280; }

    .row { display: flex; align-items: center; gap: 8px; }
    label { font-size: 12px; color: #666; flex-shrink: 0; }
    select {
      flex: 1; background: #1f2937; color: #e8e8e8;
      border: 1px solid #374151; border-radius: 6px;
      padding: 5px 8px; font-size: 12px; cursor: pointer;
    }
    .key-status { font-size: 11px; }
    .key-ok { color: #22c55e; }
    .key-no { color: #f87171; }

    textarea {
      width: 100%; background: #161619; border: 1px solid #374151;
      border-radius: 8px; color: #e8e8e8; font-size: 12px;
      padding: 8px 10px; resize: vertical; font-family: inherit;
      line-height: 1.4; min-height: 60px;
    }
    textarea::placeholder { color: #444; }
    textarea:focus { outline: none; border-color: #6b7280; }

    .warning {
      background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3);
      border-radius: 8px; padding: 8px 12px; font-size: 12px;
      color: #f87171; display: none;
    }

    .status-row { display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #444; flex-shrink: 0; }
    .dot.active { background: #22c55e; }
    .dot.error { background: #f87171; }
    .status-text { font-size: 13px; color: #aaa; }

    .buttons { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 10px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #startBtn { background: #22c55e; color: #000; }
    #stopBtn  { background: #374151; color: #e8e8e8; }
    #clearBtn { background: #1f2937; color: #9ca3af; flex: 0 0 70px; }

    .tips {
      flex: 1; background: #161619; border-radius: 8px;
      padding: 10px 12px; overflow-y: auto; font-size: 12px; color: #666;
    }
    .tip-entry {
      padding: 5px 0; border-bottom: 1px solid #1f2937;
      color: #ccc; line-height: 1.4;
    }
    .tip-entry:last-child { border-bottom: none; }
    .badge {
      display: inline-block; font-size: 9px; font-weight: 700;
      letter-spacing: 0.8px; text-transform: uppercase;
      margin-right: 5px; padding: 1px 5px; border-radius: 4px;
      background: #374151; color: #9ca3af;
    }
    .badge-objection { background: rgba(248,113,113,0.15); color: #f87171; }
    .badge-signal    { background: rgba(52,211,153,0.15);  color: #34d399; }
    .badge-discovery { background: rgba(96,165,250,0.15);  color: #60a5fa; }
    .badge-close     { background: rgba(167,139,250,0.15); color: #a78bfa; }
    .badge-tip       { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .badge-structure { background: rgba(96,165,250,0.15);  color: #60a5fa; }
    .badge-example   { background: rgba(52,211,153,0.15);  color: #34d399; }
    .badge-language  { background: rgba(251,191,36,0.15);  color: #fbbf24; }
    .badge-question  { background: rgba(167,139,250,0.15); color: #a78bfa; }
    .badge-energy    { background: rgba(248,113,113,0.15); color: #f87171; }

    .shortcut { font-size: 11px; color: #333; text-align: center; }
  </style>
</head>
<body>
  <div class="drag-area">
    <h1>ForCalls ✦</h1>
    <p class="subtitle">Real-time AI coaching — drag here to move</p>
  </div>

  <div class="mode-row">
    <button class="mode-btn active" id="modeSales" onclick="setMode('sales')">💼 Sales</button>
    <button class="mode-btn" id="modeInterview" onclick="setMode('interview')">🎯 Interview</button>
  </div>

  <div class="row">
    <label>Audio:</label>
    <select id="sourceSelect">
      <option value="microphone">🎙 Microphone</option>
      <option value="system">🔊 System Audio (captures call)</option>
    </select>
  </div>

  <div class="row">
    <label>AI:</label>
    <select id="providerSelect">
      <option value="groq">Groq (Free)</option>
      <option value="anthropic">Anthropic Claude</option>
      <option value="openai">OpenAI</option>
    </select>
    <span class="key-status" id="providerStatus">...</span>
  </div>

  <textarea id="contextInput" placeholder="💼 Paste prospect info or deal context here (optional)..."></textarea>

  <div class="warning" id="setupWarning">⚠️ Missing API keys — check your .env file</div>

  <div class="status-row">
    <div class="dot" id="dot"></div>
    <span class="status-text" id="statusText">Ready</span>
  </div>

  <div class="buttons">
    <button id="startBtn">▶ Start</button>
    <button id="stopBtn" disabled>■ Stop</button>
    <button id="clearBtn">Clear</button>
  </div>

  <div class="tips" id="tipPreview"><span style="color:#333">Tips will appear here...</span></div>

  <button id="reportBtn" style="display:none;background:#6366f1;color:#fff;padding:9px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;width:100%;">
    📄 Generate Session Report
  </button>

  <div class="shortcut">Cmd+Shift+H — toggle overlay</div>

  <script>
    window.onerror = (msg, src, line) => {
      document.body.style.background = '#1a0000';
      document.body.innerHTML = '<div style="color:#f87171;padding:20px;font-family:monospace;font-size:13px;white-space:pre-wrap">ERROR line '+line+':\n'+msg+'</div>';
    };
    let deepgramSocket = null;
    let micStream = null;
    let processor = null;
    let isCapturing = false;
    let fullTranscript = '';
    let deepgramKey = '';
    let sessionTips = [];
    let sessionMode = 'sales';
    let providers = [];

    const reportBtn = document.getElementById('reportBtn');
    const startBtn = document.getElementById('startBtn');
    const stopBtn  = document.getElementById('stopBtn');
    const clearBtn = document.getElementById('clearBtn');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const tipPreview = document.getElementById('tipPreview');
    const setupWarning = document.getElementById('setupWarning');
    const providerSelect = document.getElementById('providerSelect');
    const providerStatus = document.getElementById('providerStatus');
    const contextInput = document.getElementById('contextInput');

    const placeholders = {
      sales: '💼 Paste prospect info or deal context here (optional)...',
      interview: '🎯 Paste the job description here (optional)...',
    };

    // Load env / keys
    window.electronAPI.getEnv().then((env) => {
      deepgramKey = env.deepgramKey;
      providers = env.providers || [];
      refreshProviderStatus();
      if (!env.hasDeepgramKey) {
        setupWarning.style.display = 'block';
        startBtn.disabled = true;
      }
    });

    providerSelect.addEventListener('change', () => {
      window.electronAPI.setProvider(providerSelect.value);
      refreshProviderStatus();
    });

    contextInput.addEventListener('input', () => {
      window.electronAPI.setContext(contextInput.value);
    });

    function refreshProviderStatus() {
      const p = providers.find(p => p.key === providerSelect.value);
      if (p && p.hasKey) {
        providerStatus.textContent = '✓';
        providerStatus.className = 'key-status key-ok';
      } else {
        providerStatus.textContent = '✗ no key';
        providerStatus.className = 'key-status key-no';
      }
    }

    function setMode(mode) {
      sessionMode = mode;
      window.electronAPI.setMode(mode);
      window.electronAPI.clearTips();
      tipPreview.innerHTML = '<span style="color:#333">Tips will appear here...</span>';
      document.getElementById('modeSales').classList.toggle('active', mode === 'sales');
      document.getElementById('modeInterview').classList.toggle('active', mode === 'interview');
      contextInput.placeholder = placeholders[mode];
      contextInput.value = '';
      window.electronAPI.setContext('');
      sessionTips = [];
      reportBtn.style.display = 'none';
    }

    window.electronAPI.onCoachingTip((tip) => {
      if (!tip || tip.type === 'none' || !tip.text) return;
      sessionTips.push(tip);
      const placeholder = tipPreview.querySelector('span');
      if (placeholder) placeholder.remove();
      const entry = document.createElement('div');
      entry.className = 'tip-entry';
      entry.innerHTML = '<span class="badge badge-' + tip.type + '">' + tip.type + '</span>' + esc(tip.text);
      tipPreview.appendChild(entry);
      tipPreview.scrollTop = tipPreview.scrollHeight;
    });

    window.electronAPI.onCaptureStatus((s) => setStatus(s));
    window.electronAPI.onClearTips(() => {
      tipPreview.innerHTML = '<span style="color:#333">Tips will appear here...</span>';
    });

    startBtn.addEventListener('click', startCapture);
    stopBtn.addEventListener('click', stopCapture);
    clearBtn.addEventListener('click', () => {
      tipPreview.innerHTML = '<span style="color:#333">Tips will appear here...</span>';
      fullTranscript = '';
      window.electronAPI.clearTips();
    });

    async function startCapture() {
      try {
        setStatus('connecting');
        const mode = document.getElementById('sourceSelect').value;

        if (mode === 'system') {
          const sources = await window.electronAPI.getDesktopSources();
          if (!sources || !sources.length) throw new Error('No screen sources found');
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { chromeMediaSource: 'desktop', chromeMediaSourceId: sources[0].id },
            video: { chromeMediaSource: 'desktop', chromeMediaSourceId: sources[0].id },
          });
          micStream.getVideoTracks().forEach(t => t.stop());
        } else {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: false, noiseSuppression: false },
          });
        }

        processor = new MediaRecorder(micStream, { mimeType: 'audio/webm;codecs=opus' });

        deepgramSocket = new WebSocket(
          'wss://api.deepgram.com/v1/listen?model=nova-2&language=en-US&interim_results=true&smart_format=true&endpointing=300',
          ['token', deepgramKey]
        );

        deepgramSocket.onopen = () => {
          isCapturing = true;
          setStatus('active');
          processor.start(250);
        };

        deepgramSocket.onmessage = (e) => {
          try {
            const d = JSON.parse(e.data);
            const t = d?.channel?.alternatives?.[0]?.transcript || '';
            if (t && d?.is_final) {
              fullTranscript += ' ' + t;
              window.electronAPI.sendTranscriptChunk(t);
              window.electronAPI.sendTranscriptUpdate(fullTranscript.trim());
            }
          } catch(_) {}
        };

        deepgramSocket.onerror = () => { statusText.textContent = 'Connection error'; };
        deepgramSocket.onclose = () => { if (isCapturing) stopCapture(); };

        processor.ondataavailable = (e) => {
          if (e.data.size > 0 && deepgramSocket && deepgramSocket.readyState === WebSocket.OPEN) {
            deepgramSocket.send(e.data);
          }
        };

      } catch (err) {
        statusText.textContent = 'Error: ' + err.message;
        setStatus('error');
      }
    }

    function stopCapture() {
      isCapturing = false;
      const ws = deepgramSocket; deepgramSocket = null;
      const rec = processor; processor = null;
      const stream = micStream; micStream = null;
      try { if (ws) ws.close(); } catch(_) {}
      try { if (rec && rec.state !== 'inactive') rec.stop(); } catch(_) {}
      try { if (stream) stream.getTracks().forEach(t => t.stop()); } catch(_) {}
      setStatus('off');
    }

    function setStatus(s) {
      window.electronAPI.sendCaptureStatus(s);
      dot.className = 'dot';
      if (s === 'active') {
        dot.classList.add('active');
        statusText.textContent = 'Listening...';
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } else if (s === 'connecting') {
        statusText.textContent = 'Connecting...';
        startBtn.disabled = true;
        stopBtn.disabled = false;
      } else if (s === 'error') {
        dot.classList.add('error');
        startBtn.disabled = false;
        stopBtn.disabled = true;
      } else {
        statusText.textContent = 'Ready';
        startBtn.disabled = false;
        stopBtn.disabled = true;
        if (sessionTips.length > 0) reportBtn.style.display = 'block';
      }
    }

    // Overlay drag
    const handle = document.getElementById('modeSales'); // reuse top area
    let dragging = false, startX, startY, winX, winY;
    window.addEventListener('mousemove', (e) => {
      if (!dragging || winX === undefined) return;
      window.electronAPI.moveOverlay(winX + (e.screenX - startX), winY + (e.screenY - startY));
    });
    window.addEventListener('mouseup', () => { dragging = false; winX = undefined; });

    reportBtn.addEventListener('click', async () => {
      reportBtn.textContent = '⏳ Generating report...';
      reportBtn.disabled = true;
      try {
        const report = await window.electronAPI.generateReport({ transcript: fullTranscript, tips: sessionTips });
        downloadReport(report);
        reportBtn.textContent = '✅ Report downloaded!';
      } catch (err) {
        reportBtn.textContent = '❌ Error: ' + err.message;
      }
      setTimeout(() => {
        reportBtn.textContent = '📄 Generate Session Report';
        reportBtn.disabled = false;
      }, 3000);
    });

    function downloadReport(r) {
      const date = new Date().toLocaleDateString();
      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const scoreColor = r.score >= 8 ? '#22c55e' : r.score >= 6 ? '#f59e0b' : '#f87171';
      const mode = sessionMode === 'interview' ? 'Interview' : 'Sales Call';

      const html = `<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<title>ForCalls Report — ${date}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1f2937; }
  h1 { font-size: 28px; margin-bottom: 4px; }
  .meta { color: #6b7280; font-size: 14px; margin-bottom: 32px; }
  .score-box { background: #f9fafb; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 32px; border: 2px solid ${scoreColor}; }
  .score-num { font-size: 64px; font-weight: 800; color: ${scoreColor}; line-height: 1; }
  .score-label { font-size: 14px; color: #6b7280; margin-top: 4px; }
  .score-rationale { font-size: 15px; margin-top: 12px; color: #374151; }
  .summary { background: #eff6ff; border-left: 4px solid #3b82f6; padding: 16px 20px; border-radius: 0 8px 8px 0; margin-bottom: 32px; font-size: 15px; line-height: 1.6; }
  h2 { font-size: 18px; font-weight: 700; margin: 28px 0 12px; border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; }
  ul { padding-left: 20px; }
  li { margin-bottom: 8px; font-size: 14px; line-height: 1.5; }
  .strength { color: #065f46; }
  .mistake { margin-bottom: 16px; background: #fef2f2; border-radius: 8px; padding: 12px 16px; }
  .mistake-title { font-weight: 600; color: #991b1b; font-size: 14px; }
  .mistake-fix { color: #374151; font-size: 13px; margin-top: 4px; }
  .improvement { margin-bottom: 16px; background: #fefce8; border-radius: 8px; padding: 12px 16px; }
  .improvement-area { font-weight: 600; color: #92400e; font-size: 14px; }
  .improvement-detail { color: #374151; font-size: 13px; margin-top: 4px; }
  .pattern { background: #f3f4f6; border-radius: 6px; padding: 8px 12px; margin-bottom: 8px; font-size: 14px; }
  .top-rec { background: #1e1b4b; color: #fff; border-radius: 12px; padding: 20px 24px; margin-top: 32px; }
  .top-rec h2 { color: #a5b4fc; border-bottom-color: #4338ca; margin-top: 0; }
  .top-rec p { font-size: 15px; line-height: 1.6; margin: 0; }
  .tips-list { margin-top: 32px; }
  .tip-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f3f4f6; font-size: 13px; }
  .tip-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; background: #e5e7eb; color: #374151; white-space: nowrap; align-self: flex-start; margin-top: 1px; }
  footer { margin-top: 48px; text-align: center; font-size: 12px; color: #9ca3af; }
</style>
</head><body>
<h1>ForCalls Session Report</h1>
<p class="meta">${mode} · ${date} at ${time}</p>

<div class="score-box">
  <div class="score-num">${r.score}<span style="font-size:32px;color:#9ca3af">/10</span></div>
  <div class="score-label">Overall Score</div>
  <div class="score-rationale">${esc(r.score_rationale)}</div>
</div>

<div class="summary">${esc(r.summary)}</div>

<h2>✅ Strengths</h2>
<ul>${r.strengths.map(s => `<li class="strength">${esc(s)}</li>`).join('')}</ul>

<h2>📈 Areas for Improvement</h2>
${r.improvements.map(i => `<div class="improvement"><div class="improvement-area">${esc(i.area)}</div><div class="improvement-detail">${esc(i.detail)}</div></div>`).join('')}

<h2>⚠️ Mistakes Made</h2>
${r.mistakes.map(m => `<div class="mistake"><div class="mistake-title">${esc(m.mistake)}</div><div class="mistake-fix">Fix: ${esc(m.fix)}</div></div>`).join('')}

<h2>🔁 Repeatable Patterns</h2>
${r.repeatable_patterns.map(p => `<div class="pattern">${esc(p)}</div>`).join('')}

<div class="top-rec"><h2>🎯 Top Recommendation</h2><p>${esc(r.top_recommendation)}</p></div>

<div class="tips-list">
<h2>💬 Live Tips from This Session</h2>
${sessionTips.map(t => `<div class="tip-row"><span class="tip-badge">${t.type}</span><span>${esc(t.text)}</span></div>`).join('')}
</div>

<footer>Generated by ForCalls · ${date}</footer>
</body></html>`;

      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `forcalls-report-${date.replace(/\//g,'-')}.html`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
